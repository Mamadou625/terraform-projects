name: Project-03 Terraform Apply

on:
  push:
    branches: [main]
    paths:
      - "Project-03/**"
      - ".github/workflows/project-03-terraform-apply.yml"

permissions:
  id-token: write # required for AWS OIDC
  contents: read

env:
  AWS_REGION: ca-central-1
  TF_VERSION: "1.10.5"

jobs:
  apply-dev:
    name: apply-dev
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Project-03/environments/dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_CI_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform apply
        run: terraform apply -input=false -auto-approve

  apply-prod:
    name: apply-prod
    runs-on: ubuntu-latest
    needs: apply-dev
    # Auto-approve: prod applies automatically after dev succeeds (no manual gate).
    # To require manual approval again, add `environment: prod` here and configure
    # the 'prod' GitHub Environment with required reviewers.
    defaults:
      run:
        working-directory: Project-03/environments/prod
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_CI_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform apply
        run: terraform apply -input=false -auto-approve
